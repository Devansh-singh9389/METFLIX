# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://gradle.org

# 1. TOTAL HARDWARE UTILIZATION & MULTI-THREADING
# Run independent tasks concurrently across all processing units
org.gradle.parallel=true
# Max out CPU execution by assigning all 12 available logical processors
org.gradle.workers.max=12

# 2. CACHING & INSTANT CONFLICT FIXING
# Keeps compiled outputs in local cache to skip identical tasks next time
org.gradle.caching=true
# Completely skips project configuration phase on subsequent executions
org.gradle.configuration-cache=true
# Monitors file tracking instantly rather than doing deep storage scans
org.gradle.vfs.watch=true

# 3. MEMORY PIPELINING
# Assigns a full 4GB RAM to compilation tasks with advanced garbage recycling
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8

# 4. ENVIRONMENT SPECIFICS
kotlin.code.style=official
android.disallowKotlinSourceSets=false
android.nonTransitiveRClass=true
